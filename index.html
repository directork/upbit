<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BGF리테일 언론 지면 모니터링 자동화</title>
    <style>
      :root {
        color: #172033;
        background: #f4f7fb;
        font-family: NanumBarunGothic, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(39, 117, 255, 0.18), transparent 34rem),
          linear-gradient(180deg, #f8fbff 0%, #edf2f8 100%);
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .page-shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        align-items: stretch;
        margin-bottom: 24px;
      }

      .hero,
      .card {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(190, 203, 221, 0.7);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(33, 54, 89, 0.12);
        backdrop-filter: blur(16px);
      }

      .hero {
        padding: 36px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #2764d8;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 760px;
        margin-bottom: 18px;
        font-size: clamp(34px, 6vw, 56px);
        line-height: 1.05;
        letter-spacing: -0.05em;
      }

      h2 {
        margin-bottom: 0;
        font-size: 26px;
        letter-spacing: -0.03em;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 18px;
      }

      .hero-copy,
      .section-description,
      .status-panel p,
      .schedule-card p,
      .exception-card p {
        color: #526173;
      }

      .hero-copy {
        max-width: 720px;
        margin-bottom: 0;
        font-size: 18px;
        line-height: 1.7;
      }

      .status-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 210px;
        padding: 24px;
        border-radius: 22px;
        background: #102040;
        color: #fff;
      }

      .status-dot {
        width: 14px;
        height: 14px;
        margin-bottom: 16px;
        border-radius: 50%;
        background: #53e28d;
        box-shadow: 0 0 0 8px rgba(83, 226, 141, 0.18);
      }

      .status-panel p {
        margin: 8px 0 0;
        color: #c9d6ea;
        line-height: 1.6;
      }

      .card {
        padding: 28px;
        margin-top: 18px;
      }

      .section-heading {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 16px;
      }

      .section-description {
        margin-bottom: 20px;
        line-height: 1.7;
      }

      .schedule-grid,
      .exception-grid,
      .template-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }

      .schedule-card,
      .exception-card,
      .template-grid article {
        border: 1px solid #e1e8f2;
        border-radius: 18px;
        background: #fff;
        padding: 20px;
      }

      .time {
        display: inline-flex;
        margin-bottom: 14px;
        padding: 7px 12px;
        border-radius: 999px;
        background: #eaf1ff;
        color: #2764d8;
        font-weight: 800;
      }

      .schedule-card small {
        display: block;
        color: #7d8da1;
        line-height: 1.6;
      }

      .keyword-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .keyword-chip {
        padding: 10px 14px;
        border: 1px solid #d8e2f0;
        border-radius: 999px;
        background: #f7faff;
        font-weight: 700;
      }

      .workflow-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding-left: 24px;
        line-height: 1.7;
      }

      .workflow-list li::marker {
        color: #2764d8;
        font-weight: 800;
      }

      .file-rule {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 22px;
        padding: 16px;
        border-radius: 16px;
        background: #f1f6ff;
      }

      code,
      pre {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      code {
        color: #174fb2;
        font-weight: 700;
      }

      pre {
        min-height: 210px;
        margin: 0;
        padding: 16px;
        overflow-x: auto;
        border-radius: 14px;
        background: #101a2d;
        color: #edf5ff;
        line-height: 1.65;
        white-space: pre-wrap;
      }

      @media (max-width: 760px) {
        .page-shell {
          width: min(100% - 20px, 1120px);
          padding: 20px 0;
        }

        .hero {
          grid-template-columns: 1fr;
          padding: 26px;
        }

        .card {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
