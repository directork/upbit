<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 운세픽 (CU픽 추천)</title>
  <style>
    body {
      font-family: NanumBarunGothic, system-ui, -apple-system, sans-serif;
      background: linear-gradient(to bottom, #f8fafc, #ffffff);
      margin: 0;
      padding: 24px;
      color: #111827;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
    }
    h1, p {
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-top: 20px;
    }
    button, .link-btn {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: white;
      margin-top: 10px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
    }
    .primary {
      background: #111827;
      color: white;
      border: none;
      text-align: center;
    }
    .link-btn {
      display: block;
      text-decoration: none;
      background: #111827;
      color: white;
      text-align: center;
      box-sizing: border-box;
    }
    .product {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .fortune {
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      color: white;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      white-space: pre-line;
      line-height: 1.7;
    }
    .guide {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      line-height: 1.7;
    }
    .hidden {
      display: none;
    }
    .progress-wrap {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar {
      height: 100%;
      background: #111827;
      width: 0%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>오늘의 운세픽 (CU픽 추천)</h1>
    <p>오늘의 기분은 어떠신가요?</p>

    <div id="start-screen" class="card">
      <button id="start-btn" class="primary">시작하기</button>
    </div>

    <div id="quiz-screen" class="card hidden">
      <div class="progress-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <h2 id="question-title"></h2>
      <div id="answers"></div>
    </div>

    <div id="result-screen" class="card hidden">
      <h2>오늘의 추천 상품</h2>
      <div id="products"></div>

      <div class="fortune">
        <h3>오늘의 운세</h3>
        <div id="fortune-text"></div>
      </div>

      <div class="guide">
        <h3>오늘의 행동 가이드</h3>
        <div id="action-text"></div>
      </div>

      <a
        class="link-btn"
        href="https://chatgpt.com/g/g-68b54b5484808191a859e824c19a0246-oneulyi-cupig-cu-sinsangpum-pyeonyijeom-eumsig-cuceon-gongsig-caesbos"
        target="_blank"
        rel="noreferrer"
      >
        더 궁금한게 있다면 오늘의 CU픽으로
      </a>

      <button id="restart-btn">다시하기</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "지금 가장 가까운 내 상태는?",
        answers: [
          { text: "머리는 복잡한데 시간은 없다", type: "speed" },
          { text: "괜히 기분이 가라앉고 무기력하다", type: "healing" },
          { text: "몸이 허하고 제대로 먹고 싶다", type: "meal" },
          { text: "뭔가 재미없고 자극이 필요하다", type: "trendy" },
        ],
      },
      {
        question: "이럴 때 나는 보통 어떻게 선택하는 편인가?",
        answers: [
          { text: "빨리 해결하고 다음으로 넘어간다", type: "speed" },
          { text: "일단 기분부터 끌어올린다", type: "dessert" },
          { text: "제대로 먹고 안정감을 찾는다", type: "meal" },
          { text: "새로운 걸로 기분을 바꿔본다", type: "trendy" },
        ],
      },
    ];

    const resultMap = {
      speed: {
        products: ["참치마요 삼각김밥", "델라페 아메리카노"],
        fortune: `당신은 지금 선택 피로가 쌓인 상태일 가능성이 큽니다.
이럴 때는 오래 고민할수록 만족도가 떨어지고, 오히려 단순하고 빠른 선택이 더 잘 맞습니다.

특히 오늘은 '빨리 정리하고 다음으로 넘어가고 싶다'는 마음이 강하게 작동하는 흐름이에요.
그래서 메뉴 선택조차 일처럼 느껴질 수 있습니다.

이런 날에는 복잡한 조합보다 직관적인 선택이 오히려 높은 만족으로 이어질 가능성이 큽니다.
지금 필요한 건 화려한 자극이 아니라, 빠르게 나를 회복시키는 효율적인 한 끼일 수 있어요.`,
        action: "오늘은 오래 보지 말고 바로 집는 게 좋습니다. 한 손에 들고 빠르게 해결할 수 있는 메뉴가 특히 잘 맞습니다."
      },
      healing: {
        products: ["컵라면 + 차 음료", "디저트 세트"],
        fortune: `당신은 지금 몸보다 마음이 먼저 지친 상태일 가능성이 큽니다.
겉으로는 괜찮아 보여도, 안쪽에서는 위로받고 싶은 마음이 꽤 커져 있어요.

이런 날은 단순히 배를 채우는 것보다, '나를 좀 다독이는 선택'이 더 중요합니다.
익숙하고 편안한 메뉴가 생각보다 큰 안정감을 줄 수 있어요.

오늘은 작은 선택 하나가 하루 전체 기분을 바꿀 가능성이 큽니다.
그래서 음식은 단순한 소비가 아니라, 오늘 하루를 리셋하는 장치가 될 수 있습니다.`,
        action: "오늘은 효율보다 회복이 먼저입니다. 따뜻하거나 부드러운 조합으로 스스로를 조금 풀어주는 쪽이 잘 맞습니다."
      },
      meal: {
        products: ["PBICK 도시락", "소불고기 김밥"],
        fortune: `지금은 감정적인 허기보다 물리적인 에너지 부족이 먼저일 가능성이 큽니다.
이럴 때는 가벼운 보상보다 제대로 된 한 끼가 훨씬 높은 만족으로 이어져요.

당신은 지금 버티는 힘이 필요한 상태일 수 있습니다.
그래서 디저트처럼 순간적인 만족보다, '아 이건 좀 채워졌다' 싶은 선택이 더 중요해요.

오늘은 기본기를 챙기는 선택이 정답에 가까운 날입니다.
든든하게 채워야 기분도 같이 안정될 가능성이 큽니다.`,
        action: "오늘은 가볍게 때우기보다 식사감 있는 메뉴를 고르는 게 좋습니다. 안정감 있는 한 끼가 전체 컨디션을 끌어올릴 수 있어요."
      },
      trendy: {
        products: ["신상 스낵", "소떡소떡"],
        fortune: `당신은 지금 무료함이나 답답함을 바꿔줄 자극을 찾고 있는 상태일 수 있습니다.
이럴 때는 너무 안전한 선택보다, 살짝 재밌고 예상 밖인 선택이 더 만족스럽습니다.

오늘은 평범한 루틴보다 '오, 이거 뭐지?' 싶은 순간이 중요한 날이에요.
익숙한 메뉴보다 작은 반전이 기분 전환의 핵심이 될 수 있습니다.

특히 오늘은 메뉴 선택이 재미의 일부가 될 가능성이 큽니다.
그래서 조금은 장난스럽고 가벼운 선택이 오히려 하루를 더 살아나게 만들 수 있어요.`,
        action: "오늘은 평소 안 고르던 메뉴를 한 번 집어보는 게 좋습니다. 작은 반전이 생각보다 기분을 크게 바꿔줄 수 있어요."
      },
      dessert: {
        products: ["연세우유 생크림빵", "두바이 초코"],
        fortune: `오늘은 성과보다 감정 보상이 더 중요한 날일 수 있습니다.
머리로는 참아야 한다고 생각해도, 마음은 작은 만족을 통해 균형을 회복하려고 해요.

이럴 때의 달달한 선택은 단순한 군것질이 아니라, 기분을 다시 세우는 장치가 되기 쉽습니다.
지금 당신에게 필요한 건 거창한 해결책보다, 작지만 확실한 만족일 수 있어요.

오늘은 '이 정도는 괜찮아' 하고 스스로에게 허락해주는 태도가 오히려 전체 만족도를 올릴 가능성이 큽니다.`,
        action: "오늘은 너무 계산적으로만 고르지 말고, 기분이 좋아질 메뉴를 하나 포함해보세요. 작은 보상이 하루의 톤을 바꿀 수 있습니다."
      }
    };

    let current = 0;
    let answers = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionTitle = document.getElementById("question-title");
    const answersWrap = document.getElementById("answers");
    const productsWrap = document.getElementById("products");
    const fortuneText = document.getElementById("fortune-text");
    const actionText = document.getElementById("action-text");
    const progressBar = document.getElementById("progress-bar");

    function getResult() {
      const count = {};
      answers.forEach((a) => {
        count[a.type] = (count[a.type] || 0) + 1;
      });
      const sorted = Object.entries(count).sort((a, b) => b[1] - a[1]);
      const topType = sorted[0]?.[0] || "speed";
      return resultMap[topType];
    }

    function renderQuestion() {
      const q = questions[current];
      progressBar.style.width = `${(current / questions.length) * 100}%`;
      questionTitle.textContent = q.question;
      answersWrap.innerHTML = "";

      q.answers.forEach((a) => {
        const btn = document.createElement("button");
        btn.textContent = a.text;
        btn.onclick = () => {
          answers.push(a);
          current += 1;
          if (current >= questions.length) {
            showResult();
          } else {
            renderQuestion();
          }
        };
        answersWrap.appendChild(btn);
      });
    }

    function showResult() {
      const result = getResult();
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      productsWrap.innerHTML = "";
      result.products.forEach((p) => {
        const div = document.createElement("div");
        div.className = "product";
        div.textContent = p;
        productsWrap.appendChild(div);
      });

      fortuneText.textContent = result.fortune;
      actionText.textContent = result.action;
    }

    document.getElementById("start-btn").onclick = () => {
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      renderQuestion();
    };

    document.getElementById("restart-btn").onclick = () => {
      current = 0;
      answers = [];
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
      progressBar.style.width = "0%";
    };
  </script>
</body>
</html>
